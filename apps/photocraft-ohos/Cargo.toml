[package]
name = "photocraft-ohos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# N-API's module registration macro contains the platform FFI. The editor and
# all engine crates retain the workspace's unsafe_code = forbid policy.
[lints.rust]
unsafe_code = "deny"

[features]
ohos-control = ["photocraft/ohos-control"]

[target.'cfg(target_env = "ohos")'.dependencies]
photocraft = { path = "../photocraft" }
log.workspace = true
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "385ce749121b56ea33226f8542e3f39afd6e5ed6" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git", rev = "385ce749121b56ea33226f8542e3f39afd6e5ed6" }
napi-ohos = "1.2"
napi-derive-ohos = "1.2"
ohos-hilog-binding = { version = "0.2.3", features = ["log"] }

[build-dependencies]
napi-build-ohos = "1.2"
